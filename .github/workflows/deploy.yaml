name: Deploy Docs

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache viabl
        uses: actions/cache@v4
        with:
          path: ~/.viabl
          key: viabl-${{ hashFiles('docs.json') }}
          restore-keys: |
            viabl-

      - name: Install Viabl CLI
        run: npm install -g @viablkit/cli

      - name: Build docs
        run: viabl build

      - name: Create .env file
        run: |
          cat > .env << EOF
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          EOF

      - name: Copy build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".viabl/,Dockerfile,.env"
          target: "/opt/viabl/viabl-docs"
          rm: true

      - name: Build and restart Docker container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/viabl/viabl-docs

            docker build -t viabl-docs .

            docker rm -f viabl-docs || true

            docker run -d \
              --name viabl-docs \
              --restart unless-stopped \
              -p 7777:7777 \
              --env-file .env \
              -e PORT=7777 \
              viabl-docs

            docker image prune -f
