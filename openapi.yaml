openapi: 3.0.3

info:
  title: My API
  description: API documentation for My Product. Use these endpoints to integrate our services into your application.
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production Environment
  - url: https://staging-api.example.com/v1
    description: Staging Environment

tags:
  - name: Authentication
    description: Endpoints for acquiring and refreshing access tokens
  - name: Users
    description: Endpoints for managing user accounts
  - name: Projects
    description: Endpoints for workspace and project management

paths:
  # ---------------------------------------------------------
  # AUTHENTICATION
  # ---------------------------------------------------------
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login to account
      description: Authenticate with email and password to receive a Bearer token.
      security: [] # ← This triggers the new PUBLIC badge!
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: developer@example.com
                password:
                  type: string
                  format: password
                  example: correct-horse-battery-staple
      responses:
        "200":
          description: Successfully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------
  # USERS
  # ---------------------------------------------------------
  /users:
    get:
      tags: [Users]
      summary: List users
      description: Returns a paginated list of all users in your workspace.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: A paginated list of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  total:
                    type: integer
                    example: 142
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags: [Users]
      summary: Create user
      description: Provision a new user account and send an invitation email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email:
                  type: string
                  format: email
                  example: alex@example.com
                name:
                  type: string
                  example: Alex Johnson
                role:
                  type: string
                  enum: [admin, member, viewer]
                  default: member
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{id}:
    get:
      tags: [Users]
      summary: Get a user
      description: Retrieve a specific user's details by their unique identifier.
      parameters:
        - name: id
          in: path
          required: true
          description: The user ID
          schema:
            type: string
            example: usr_01abc123
      responses:
        "200":
          description: The user object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [Users]
      summary: Delete a user
      description: Permanently remove a user from the workspace. This action cannot be undone.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: usr_01abc123
      responses:
        "204":
          description: User deleted successfully

  # ---------------------------------------------------------
  # PROJECTS
  # ---------------------------------------------------------
  /projects:
    get:
      tags: [Projects]
      summary: List projects
      description: Retrieve all active projects you have access to.
      responses:
        "200":
          description: A list of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{projectId}/deploy:
    post:
      tags: [Projects]
      summary: Trigger deployment
      description: Manually trigger a build and deployment for a specific project.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            example: prj_99xyz888
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                branch:
                  type: string
                  default: main
                  description: The git branch to deploy
      responses:
        "202":
          description: Deployment triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  deploymentId:
                    type: string
                    example: dpl_456def
                  status:
                    type: string
                    example: queued

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the user
          example: usr_01abc123
        email:
          type: string
          format: email
          description: Primary email address
          example: jane@example.com
        name:
          type: string
          description: Full name of the user
          example: Jane Smith
        role:
          type: string
          description: Workspace access level
          enum: [admin, member, viewer]
          example: admin
        createdAt:
          type: string
          format: date-time
          example: 2024-01-15T08:30:00Z

    Project:
      type: object
      properties:
        id:
          type: string
          example: prj_99xyz888
        name:
          type: string
          example: Frontend Application
        framework:
          type: string
          example: nextjs
        repository:
          type: string
          example: github.com/organization/repo
        status:
          type: string
          enum: [building, ready, failed]
          example: ready

    Error:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: not_found
        message:
          type: string
          description: Human-readable error message
          example: The requested resource could not be found.
        docUrl:
          type: string
          description: Link to documentation about this specific error
          format: uri
          example: https://docs.example.com/api-reference/errors#not-found

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

# Apply Bearer token requirement globally
security:
  - bearerAuth: []
